name = "crosstalk-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "INVITES"
class_name = "Invites"

[[durable_objects.bindings]]
name = "STREAM_POOL"
class_name = "StreamPool"

# SQLite-backed objects are the ones available on the free plan.
#
# An applied tag is a record of what already happened, so v1 keeps the name the
# class had when it was created. Renaming it is a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Room", "Pairing"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Pairing", to = "Invites" }]

# Everyone's live stream frames for the day, in one small object (streams.ts).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["StreamPool"]

[observability]
enabled = true
