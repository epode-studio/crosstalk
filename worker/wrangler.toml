name = "crosstalk-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "INVITES"
class_name = "Invites"

# SQLite-backed objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Room", "Invites"]

[observability]
enabled = true
